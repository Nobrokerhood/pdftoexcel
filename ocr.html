<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const user = sessionStorage.getItem("nobroker_user");
    const sessionToken = sessionStorage.getItem("accounting_session_token");
    if (!user) {
      window.location.href = "index.html";
    }
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NoBrokerHood | Legacy Converter</title>
  <link rel="icon" href="https://www.nobrokerhood.com/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #607089;
      --line: #d9e1ec;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --danger: #b42318;
      --warn: #9a6700;
      --focus: #2563eb;
      --field: #fbfcfe;
      --ok-bg: #e8f5f2;
      --warn-bg: #fff7df;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand { width: 160px; }

    nav { display: grid; gap: 6px; }

    nav a,
    .logout,
    button {
      min-height: 44px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    nav a,
    .logout {
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: var(--text);
      text-decoration: none;
      border: 0;
      background: transparent;
      text-align: left;
    }

    nav a.active {
      background: var(--ok-bg);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .logout {
      margin-top: auto;
      color: var(--danger);
    }

    main { padding: 24px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .container {
      width: min(100%, 560px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.06);
    }

    p {
      color: var(--muted);
      margin: 0 0 18px;
    }

    input[type="file"] {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      margin-bottom: 12px;
    }

    input[type="file"]::file-selector-button {
      background: var(--primary);
      color: #ffffff;
      border: 0;
      border-radius: 6px;
      padding: 8px 14px;
      margin-right: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .hint {
      color: var(--warn);
      background: var(--warn-bg);
      border: 1px solid #f3d383;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      border: 0;
      padding: 0 16px;
      color: #ffffff;
      font-weight: 700;
    }

    .primary-button { background: var(--primary); }
    .secondary-button { background: var(--focus); }
    .split-button { background: var(--warn); }
    button:hover { filter: brightness(0.95); }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    #loader {
      display: none;
      margin-top: 20px;
      color: var(--muted);
    }

    .spinner {
      border: 4px solid var(--line);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status {
      margin: 15px 0 0;
      min-height: 24px;
      font-weight: 600;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <img class="brand" src="https://www.nobrokerhood.com/assets/images/logo.png" alt="NoBrokerHood">
      <nav aria-label="Primary">
        <a href="accounting.html?v=light-ui">Accounting AI</a>
        <a href="ocr.html?v=light-ui" class="active">Legacy Converter</a>
        <a href="voice.html?v=light-ui">Voice Tool</a>
      </nav>
      <button class="logout" type="button" onclick="logout()">Logout</button>
    </aside>

    <main>
      <div class="topbar">
        <h1>Legacy Converter</h1>
      </div>

      <section class="container">
        <h2>AI Document Converter</h2>
        <p>Upload your PDF or image (&lt;=10 MB) for conversion or splitting.</p>

        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

        <p class="hint">If your PDF has more than 5 pages, please use the <b>Split PDF</b> option first.</p>

        <div class="actions">
          <button onclick="processFile('template')" class="primary-button">Convert to CSV</button>
          <button onclick="processFile('excel')" class="secondary-button">Convert to Excel</button>
          <button onclick="splitPDF()" class="split-button">Split PDF</button>
        </div>

        <div id="loader">
          <div class="spinner"></div>
          <p>Processing, please wait...</p>
        </div>

        <p id="status"></p>
      </section>
    </main>
  </div>

  <script>
    const BASE_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? "http://127.0.0.1:8030"
      : "https://pdftoexcel-846x.onrender.com";
    const USER_EMAIL = sessionStorage.getItem("nobroker_user");
    const SESSION_TOKEN = sessionStorage.getItem("accounting_session_token");

    function setStatus(message, type = "muted") {
      const status = document.getElementById("status");
      status.textContent = message;
      status.style.color = type === "ok" ? "#115e59" : type === "error" ? "#b42318" : "#607089";
    }

    async function processFile(type) {
      const file = document.getElementById("fileInput").files[0];
      const loader = document.getElementById("loader");

      if (!file) {
        setStatus("Please select a file.", "error");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      setStatus("");
      loader.style.display = "block";

      const endpoint = type === "template" ? "/process-document/" : "/export-to-excel/";
      const filename = type === "template" ? "converted_template.csv" : "exported_data.xlsx";

      try {
        const headers = { "X-User-Email": USER_EMAIL || "anonymous" };
        if (SESSION_TOKEN) headers.Authorization = "Bearer " + SESSION_TOKEN;
        const res = await fetch(BASE_URL + endpoint, {
          method: "POST",
          headers,
          body: formData
        });
        if (res.ok) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
          setStatus("Success. File is downloading.", "ok");
        } else {
          const err = await res.json();
          setStatus(err.detail || "Conversion failed.", "error");
        }
      } catch (error) {
        setStatus("Server error. Please try again.", "error");
      }

      loader.style.display = "none";
    }

    async function splitPDF() {
      const file = document.getElementById("fileInput").files[0];
      const loader = document.getElementById("loader");

      if (!file) {
        setStatus("Select a PDF file first.", "error");
        return;
      }

      if (!file.name.toLowerCase().endsWith(".pdf")) {
        setStatus("Only PDF files can be split.", "error");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      setStatus("");
      loader.style.display = "block";

      try {
        const headers = { "X-User-Email": USER_EMAIL || "anonymous" };
        if (SESSION_TOKEN) headers.Authorization = "Bearer " + SESSION_TOKEN;
        const res = await fetch(BASE_URL + "/split-pdf/", {
          method: "POST",
          headers,
          body: formData
        });

        if (res.ok) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "split_parts.zip";
          a.click();
          URL.revokeObjectURL(url);
          setStatus("PDF successfully split.", "ok");
        } else {
          const err = await res.json();
          setStatus(err.detail || "Split failed.", "error");
        }
      } catch (error) {
        setStatus("Error while splitting PDF.", "error");
      }

      loader.style.display = "none";
    }

    async function logout() {
      if (SESSION_TOKEN) {
        await fetch(BASE_URL + "/auth/logout", {
          method: "POST",
          headers: { "Authorization": "Bearer " + SESSION_TOKEN }
        }).catch(() => {});
      }
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
  <script src="session_timeout.js"></script>
  <script src="knowledge-bot-v2.js"></script>
</body>
</html>
