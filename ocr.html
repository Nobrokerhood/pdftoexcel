<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // SECURITY CHECK
  const user = sessionStorage.getItem("nobroker_user");
  if (!user) {
    window.location.href = "index.html"; // Kick them back to login
  }
  </script>
  <meta charset="UTF-8">
  <title>NoBrokerHood | AI Document Converter</title>
  <link rel="icon" href="https://www.nobrokerhood.com/favicon.ico">
  <style>
    /* --- MODIFIED BODY STYLE --- */
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #000000, #001a33);
      display: flex; /* <-- This is the main layout change */
      min-height: 100vh;
      margin: 0;
      color: #f0f2f5;
    }

    /* --- NEW SIDEBAR STYLES --- */
    .sidebar {
      width: 220px;
      background: #001a33;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      height: 100vh;
      flex-shrink: 0; /* Prevents sidebar from shrinking */
    }
    .sidebar img { 
      width: 120px; 
      margin-bottom: 10px; 
    }
    .sidebar a { 
      color: #dbefff; 
      margin: 10px 0; 
      text-decoration: none; 
      font-weight: bold;
      font-size: 1.1rem;
    }
    .sidebar a.active { 
      color: #00ff99; /* The highlight color */
    }
    /* --- END NEW STYLES --- */


    /* --- NEW MAIN CONTENT WRAPPER --- */
    /* This new div centers your original container */
    .main-content {
      flex: 1; /* Takes up remaining space */
      display: flex; /* Re-applies the centering */
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow-y: auto; /* Allows scrolling if content is too big */
      padding: 20px; /* Adds some padding */
      box-sizing: border-box; /* Includes padding in height/width */
    }

    /* --- YOUR ORIGINAL STYLES (UNCHANGED) --- */
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      text-align: center;
      padding: 45px 40px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 190px;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 6px rgba(0, 191, 255, 0.5));
    }
    h1 {
      color: #00bfff;
      margin-bottom: 12px;
    }
    p {
      color: #dcdcdc;
      margin-bottom: 20px;
    }
    input[type="file"] {
      border: 1px solid #00bfff;
      background: transparent;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 10px;
    }
    input[type="file"]::file-selector-button {
      background: #00bfff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    input[type="file"]::file-selector-button:hover {
      background-color: #0099cc;
    }
    .hint {
      font-size: 13px;
      color: #ffcc00;
      margin-bottom: 20px;
      font-style: italic;
    }
    button {
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 8px;
      transition: 0.3s ease;
    }
    .primary-button {
      background-color: #00bfff;
    }
    .secondary-button {
      background-color: #1877f2;
    }
    .split-button {
      background-color: #ff9800;
    }
    button:hover {
      transform: scale(1.05);
    }
    #loader {
      display: none;
      margin-top: 20px;
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #00bfff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #status {
      margin-top: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  
  <div class="sidebar">
  <img src="https://www.nobrokerhood.com/assets/images/logo-white.png" alt="logo">
  <a href="ocr.html" class="active">📄 OCR Tool</a>
  <a href="voice.html">🎙️ Voice Tool</a>
  
  <div style="margin-top: auto; margin-bottom: 20px;">
    <a href="#" onclick="logout()" style="color: #ff4444; font-size: 0.9rem; text-align: center; display: block; width: 100%;">Logout</a>
  </div>
  </div>
  
  <div class="main-content">
  
    <div class="container">
      <img src="https://www.nobrokerhood.com/assets/images/logo-white.png" alt="NoBrokerHood Logo" class="logo">
      <h1>AI Document Converter</h1>
      <p>Upload your PDF or image (≤10 MB) for conversion or splitting.</p>

      <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

      <p class="hint">💡 If your PDF has more than 5 pages, please use the <b>Split PDF</b> option first.</p>

      <button onclick="processFile('template')" class="primary-button">Convert to CSV (Template)</button>
      <button onclick="processFile('excel')" class="secondary-button">Convert to Excel (As-Is)</button>
      <button onclick="splitPDF()" class="split-button">Split PDF (Large Files)</button>

      <div id="loader">
        <div class="spinner"></div>
        <p>Processing, please wait…</p>
      </div>

      <p id="status"></p>
    </div>
    
  </div> <script>
    const BASE_URL = "https://pdftoexcel-846x.onrender.com";
    const USER_EMAIL = sessionStorage.getItem("nobroker_user");
    
    async function processFile(type) {
      const f = document.getElementById('fileInput').files[0];
      const status = document.getElementById('status');
      const loader = document.getElementById('loader');

      if (!f) {
        status.textContent = "Please select a file.";
        status.style.color = "#ff6666";
        return;
      }

      const fd = new FormData();
      fd.append('file', f);

      status.textContent = "";
      loader.style.display = 'block';

      let endpoint = type === 'template' ? '/process-document/' : '/export-to-excel/';
      let filename = type === 'template' ? 'converted_template.csv' : 'exported_data.xlsx';

      try {
        const res = await fetch(BASE_URL + endpoint, {
        method: 'POST',headers: {"X-User-Email": USER_EMAIL || "anonymous"},body: fd});
        if (res.ok) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
          status.textContent = "✅ Success! File is downloading.";
          status.style.color = "#00ff99";
        } else {
          const err = await res.json();
          status.textContent = `⚠️ ${err.detail}`;
          status.style.color = "#ff6666";
        }
      } catch (e) {
        status.textContent = "❌ Server error. Please try again.";
        status.style.color = "#ff6666";
      }

      loader.style.display = 'none';
    }

    async function splitPDF() {
      const f = document.getElementById('fileInput').files[0];
      const status = document.getElementById('status');
      const loader = document.getElementById('loader');

      if (!f) {
        status.textContent = "Select a PDF file first.";
        status.style.color = "#ff6666";
        return;
      }

      if (!f.name.endsWith('.pdf')) {
        status.textContent = "Only PDF files can be split.";
        status.style.color = "#ff6666";
        return;
      }

      const fd = new FormData();
      fd.append('file', f);

      status.textContent = "";
      loader.style.display = 'block';

      try {
          const res = await fetch(BASE_URL + endpoint, {
          method: 'POST',headers: {"X-User-Email": USER_EMAIL || "anonymous"},body: fd});
          if (res.ok) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'split_parts.zip';
          a.click();
          URL.revokeObjectURL(url);
          status.textContent = "✅ PDF successfully split.";
          status.style.color = "#00ff99";
        } else {
          const err = await res.json();
          status.textContent = `⚠️ ${err.detail}`;
          status.style.color = "#ff6666";
        }
      } catch (e) {
        status.textContent = "❌ Error while splitting PDF.";
        status.style.color = "#ff6666";
      }

      loader.style.display = 'none';
    }
    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
      }
  </script>
</body>
</html>
