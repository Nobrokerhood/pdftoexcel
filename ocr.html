<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // SECURITY CHECK
    const user = sessionStorage.getItem("nobroker_user");
    if (!user) {
      window.location.href = "index.html";
    }
  </script>

  <meta charset="UTF-8">
  <title>NoBrokerHood | AI Document Converter</title>
  <link rel="icon" href="https://www.nobrokerhood.com/favicon.ico">

  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #000000, #001a33);
      display: flex;
      min-height: 100vh;
      margin: 0;
      color: #f0f2f5;
    }

    .sidebar {
      width: 220px;
      background: #001a33;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      height: 100vh;
    }

    .sidebar img { width: 120px; margin-bottom: 10px; }
    .sidebar a {
      color: #dbefff;
      margin: 10px 0;
      text-decoration: none;
      font-weight: bold;
    }
    .sidebar a.active { color: #00ff99; }

    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 45px;
      max-width: 520px;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-button { background:#00bfff; color:white; }
    .secondary-button { background:#1877f2; color:white; }
    .split-button { background:#ff9800; color:white; }

    #loader { display:none; }
  </style>
</head>

<body>

<div class="sidebar">
  <img src="https://www.nobrokerhood.com/assets/images/logo-white.png">
  <a href="ocr.html" class="active">📄 OCR Tool</a>
  <a href="voice.html">🎙 Voice Tool</a>

  <a href="#" onclick="logout()" style="margin-top:auto;color:#ff4444;">Logout</a>
</div>

<div class="main-content">
  <div class="container">
    <h1>AI Document Converter</h1>

    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

    <button onclick="processFile('template')" class="primary-button">
      Convert to CSV
    </button>

    <button onclick="processFile('excel')" class="secondary-button">
      Convert to Excel
    </button>

    <button onclick="splitPDF()" class="split-button">
      Split PDF
    </button>

    <div id="loader">Processing...</div>
    <p id="status"></p>
  </div>
</div>

<script>
  const BASE_URL = "https://pdftoexcel-846x.onrender.com";
  const USER_EMAIL = sessionStorage.getItem("nobroker_user");

  async function processFile(type) {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Select file");

    const fd = new FormData();
    fd.append("file", file);

    const endpoint = type === "template"
      ? "/process-document/"
      : "/export-to-excel/";

    await fetch(BASE_URL + endpoint, {
      method: "POST",
      body: fd,
      headers: {
        "X-User-Email": USER_EMAIL   // ✅ EMAIL SENT HERE
      }
    });
  }

  async function splitPDF() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return alert("Select PDF");

    const fd = new FormData();
    fd.append("file", file);

    await fetch(BASE_URL + "/split-pdf/", {
      method: "POST",
      body: fd,
      headers: {
        "X-User-Email": USER_EMAIL   // ✅ EMAIL SENT HERE
      }
    });
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = "index.html";
  }
</script>

</body>
</html>
