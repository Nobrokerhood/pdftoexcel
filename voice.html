<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    const user = sessionStorage.getItem("nobroker_user");
    if (!user) {
      window.location.href = "index.html";
    }
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NoBrokerHood | Voice Tool</title>
  <link rel="icon" href="https://www.nobrokerhood.com/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #607089;
      --line: #d9e1ec;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --danger: #b42318;
      --focus: #2563eb;
      --field: #fbfcfe;
      --ok-bg: #e8f5f2;
      --bad-bg: #fff0ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand { width: 160px; }

    nav { display: grid; gap: 6px; }

    nav a,
    .logout,
    button {
      min-height: 44px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }

    nav a,
    .logout {
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: var(--text);
      text-decoration: none;
      border: 0;
      background: transparent;
      text-align: left;
    }

    nav a.active {
      background: var(--ok-bg);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .logout {
      margin-top: auto;
      color: var(--danger);
    }

    main { padding: 24px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .container {
      width: min(100%, 620px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.06);
    }

    p {
      color: var(--muted);
      margin: 0 0 18px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    select,
    input[type="file"] {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      margin-bottom: 14px;
    }

    .actions,
    #postRecordingControls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      border: 0;
      padding: 0 16px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
    }

    button:hover { filter: brightness(0.95); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #recordButton.recording { background: var(--danger); }
    #downloadBackupButton { background: var(--focus); }

    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 6px;
      padding: 0 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      margin-top: 10px;
    }

    #status {
      margin-top: 18px;
      min-height: 24px;
      color: var(--muted);
      font-weight: 600;
    }

    .hidden { display: none; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <img class="brand" src="https://www.nobrokerhood.com/assets/images/logo.png" alt="NoBrokerHood">
      <nav aria-label="Primary">
        <a href="accounting.html?v=light-ui">Accounting AI</a>
        <a href="ocr.html?v=light-ui">Legacy Converter</a>
        <a href="voice.html?v=light-ui" class="active">Voice Tool</a>
      </nav>
      <button class="logout" type="button" onclick="logout()">Logout</button>
    </aside>

    <main>
      <div class="topbar">
        <h1>Voice Tool</h1>
      </div>

      <section class="container">
        <h2>Voice to Excel Entry</h2>
        <p>Select a template and record an audio entry.</p>

        <label for="templateSelect">Billing Template</label>
        <select id="templateSelect">
          <option value="template1">Template 1 (Import Receipts)</option>
          <option value="template2">Template 2 (Vendor Upload)</option>
          <option value="template3">Template 3 (Maintenance)</option>
        </select>

        <div class="actions">
          <button id="recordButton" type="button">Start Recording</button>
        </div>

        <div id="postRecordingControls" class="hidden">
          <button id="downloadBackupButton" type="button">Download Audio Backup</button>
          <button id="submitButton" type="button">Submit for Processing</button>
        </div>

        <label for="uploadBackupInput" class="upload-button hidden" id="uploadBackupLabel">
          Upload Backup File
        </label>
        <input type="file" id="uploadBackupInput" accept="audio/*" class="hidden">

        <p id="status">Status: Idle</p>
      </section>
    </main>
  </div>

  <script>
    const recordButton = document.getElementById("recordButton");
    const statusText = document.getElementById("status");
    const templateSelect = document.getElementById("templateSelect");
    const postRecordingControls = document.getElementById("postRecordingControls");
    const downloadBackupButton = document.getElementById("downloadBackupButton");
    const submitButton = document.getElementById("submitButton");
    const uploadBackupInput = document.getElementById("uploadBackupInput");
    const uploadBackupLabel = document.getElementById("uploadBackupLabel");

    let mediaRecorder;
    let audioChunks = [];
    let audioBlob = null;
    let isRecording = false;

    recordButton.addEventListener("click", async () => {
      if (isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        recordButton.textContent = "Start Recording";
        recordButton.classList.remove("recording");
        statusText.textContent = "Status: Recording stopped. Ready to submit.";
        postRecordingControls.classList.remove("hidden");
        recordButton.disabled = true;
        uploadBackupLabel.classList.remove("hidden");
        return;
      }

      try {
        audioChunks = [];
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });

        mediaRecorder.ondataavailable = (event) => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          audioBlob = new Blob(audioChunks, { type: "audio/webm;codecs=opus" });
        };

        mediaRecorder.start();
        isRecording = true;
        recordButton.textContent = "Stop Recording";
        recordButton.classList.add("recording");
        statusText.textContent = "Status: Recording...";
        postRecordingControls.classList.add("hidden");
        uploadBackupLabel.classList.add("hidden");
      } catch (error) {
        console.error("Error starting recording:", error);
        statusText.textContent = "Error: Could not start recording. Check mic permissions.";
      }
    });

    downloadBackupButton.addEventListener("click", () => {
      if (!audioBlob) return;

      const url = URL.createObjectURL(audioBlob);
      const a = document.createElement("a");
      a.style.display = "none";
      a.href = url;
      a.download = `voice_backup_${new Date().toISOString()}.webm`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      statusText.textContent = "Status: Backup downloaded.";
    });

    submitButton.addEventListener("click", () => {
      if (!audioBlob) {
        alert("No audio recorded to submit.");
        return;
      }
      uploadAudio(audioBlob);
    });

    uploadBackupInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) {
        statusText.textContent = `Status: Uploading backup file: ${file.name}`;
        uploadAudio(file);
      }
    });

    function uploadAudio(fileToUpload) {
      const template = templateSelect.value;
      const formData = new FormData();
      formData.append("template", template);
      formData.append("audio", fileToUpload, "recording.webm");

      statusText.textContent = "Status: Uploading and processing. This may take a moment.";
      submitButton.disabled = true;
      downloadBackupButton.disabled = true;
      recordButton.disabled = true;
      uploadBackupLabel.classList.add("hidden");

      const RENDER_URL = "https://voice-backend-83ht.onrender.com/api/process-audio";

      fetch(RENDER_URL, {
        method: "POST",
        body: formData
      })
      .then(response => {
        if (!response.ok) {
          throw new Error(`Server error: ${response.statusText}`);
        }
        return response.blob();
      })
      .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = "billing_report.xlsx";
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        statusText.textContent = "Status: Success. Excel file downloaded.";
        resetUI();
      })
      .catch(error => {
        console.error("Upload error:", error);
        statusText.textContent = `Error: ${error.message}. Please try again or use a backup.`;
        resetUI();
      });
    }

    function resetUI() {
      submitButton.disabled = false;
      downloadBackupButton.disabled = false;
      recordButton.disabled = false;
      postRecordingControls.classList.add("hidden");
      uploadBackupLabel.classList.remove("hidden");
      audioBlob = null;
      audioChunks = [];
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
