<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Accounting AI | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5f6f89;
      --line: #d9e1ec;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --danger: #b42318;
      --focus: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(92vw, 420px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.08);
    }

    .brand {
      width: 174px;
      display: block;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .signin-container {
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      color: var(--danger);
      font-size: 14px;
    }

    .status.ok { color: var(--primary-dark); }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="https://www.nobrokerhood.com/assets/images/logo.png" alt="NoBrokerHood">
    <h1>Accounting AI</h1>
    <p>Continue with Google</p>

    <div class="signin-container">
      <div id="googleSignIn"></div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const BASE_URL = window.__API_BASE__ ||
      ((location.hostname === "localhost" || location.hostname === "127.0.0.1")
        ? "http://127.0.0.1:8030"
        : (location.hostname.endsWith("github.io")
            ? "https://pdftoexcel-846x.onrender.com"
            : ""));

    async function loadPublicConfig(retries = 3) {
      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          const res = await fetch(BASE_URL + "/config/public");
          if (res.ok) {
            return await res.json();
          }
          const errData = await res.json().catch(() => ({}));
          if (attempt === retries) {
            return { error: errData.detail || "Google OAuth client is not configured on the server." };
          }
        } catch (error) {
          if (attempt === retries) {
            return { error: error.message || "Google OAuth client is not configured on the server." };
          }
        }
        await new Promise(r => setTimeout(r, 1500));
      }
    }

    function renderGoogleButton(clientId) {
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(() => renderGoogleButton(clientId), 100);
        return;
      }
      window.google.accounts.id.initialize({
        client_id: clientId,
        callback: handleCredentialResponse,
        auto_select: false,
        use_fedcm_for_prompt: false
      });
      window.google.accounts.id.renderButton(
        document.getElementById("googleSignIn"),
        {
          type: "standard",
          size: "large",
          theme: "outline",
          text: "continue_with",
          shape: "rectangular",
          width: 260
        }
      );
    }

    async function handleCredentialResponse(response) {
      const status = document.getElementById("status");
      status.textContent = "Signing in...";
      status.className = "status ok";

      try {
        const res = await fetch(BASE_URL + "/auth/google-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential })
        });

        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.detail || "Access denied.";
          status.className = "status";
          return;
        }

        sessionStorage.setItem("accounting_session_token", data.session_token);
        sessionStorage.setItem("accounting_session_id", data.session_id);
        sessionStorage.setItem("nobroker_user", data.email);
        sessionStorage.setItem("accounting_user", JSON.stringify({
          email: data.email,
          name: data.name,
          role: data.role
        }));
        window.location.href = "accounting.html?v=light-ui";
      } catch (error) {
        status.textContent = "Login service is unavailable.";
        status.className = "status";
      }
    }

    loadPublicConfig().then((config) => {
      if (config && config.google_client_id) {
        renderGoogleButton(config.google_client_id);
      } else {
        const status = document.getElementById("status");
        status.textContent = (config && config.error) || "Google OAuth client is not configured on the server.";
        status.className = "status";
      }
    });
  </script>
</body>
</html>
