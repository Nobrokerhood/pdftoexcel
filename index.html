<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NoBrokerHood Tools | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>

  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #000000, #001a33);
      color: #f0f2f5;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 15px;
      border: 1px solid #00bfff;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 191, 255, 0.2);
      max-width: 400px;
      width: 90%;
    }

    h2 {
      margin-bottom: 10px;
      color: #00bfff;
    }

    p {
      color: #88aabb;
      margin-bottom: 30px;
    }

    #error-msg {
      color: #ff4444;
      margin-top: 20px;
      display: none;
    }

    .signin-container {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      min-height: 40px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <img src="https://www.nobrokerhood.com/assets/images/logo-white.png"
         alt="logo"
         width="180"
         style="margin-bottom: 20px;">

    <h2>Internal Tools Portal</h2>
    <p>Please sign in with your <b>@nobroker.in</b> account.</p>

    <div class="signin-container">
      <div id="g_id_onload"
           data-client_id="414963441128-69gsdlfdfn8hrf7ovgc9mfh10spnc5nq.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_select="false"
           data-use_fedcm_for_prompt="false">
      </div>

      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="filled_blue"
           data-text="sign_in_with"
           data-shape="rectangular"
           data-width="250">
      </div>
    </div>

    <p id="error-msg"></p>
  </div>

  <script>
    function handleCredentialResponse(response) {
      try {
        const payload = decodeJwtResponse(response.credential);
        const email = payload.email;

        if (!email.endsWith("@nobroker.in")) {
          const err = document.getElementById("error-msg");
          err.textContent = "Access Denied. " + email + " is not authorized.";
          err.style.display = "block";
          return;
        }

        // 🔐 Send login audit to backend
        fetch("https://pdftoexcel-846x.onrender.com/login-log", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            name: payload.name || "",
            login_time: new Date().toISOString()
          })
        })
        .catch(err => {
          console.error("Login logging failed:", err);
          // Do NOT block login if logging fails
        })
        .finally(() => {
          sessionStorage.setItem("nobroker_user", email);
          window.location.href = "ocr.html";
        });

      } catch (e) {
        console.error("Login Error:", e);
      }
    }

    function decodeJwtResponse(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
          .join('')
      );
      return JSON.parse(jsonPayload);
    }
  </script>

</body>
</html>
